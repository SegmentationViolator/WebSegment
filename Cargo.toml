[package]
name = "web-segment"
version = "0.11.3"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["SegmentationViolator <segmentationviolator@proton.me>"]

[dependencies]
gloo-timers = "0.4"
html5gum = "0.8.3"
pulldown-cmark = "0.13.3"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stylist = { version = "0.15", features = ["yew_integration"] }
wasm-bindgen = "0.2"
yew = { version = "0.23", features = ["csr"] }
yew-hooks = "0.6"
yew-router = "0.20"

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "Location",
    "Window",
]

[features]
pri-demon-th = []

[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'
panic = "abort"
strip = true
